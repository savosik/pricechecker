services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mp_parse2_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mp_parse2_network
    depends_on:
      - mysql
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mp_parse2_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/laravel-worker.conf
    environment:
      LOG_CHANNEL: stderr
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mp_parse2_network
    depends_on:
      - app
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: mp_parse2_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    networks:
      - mp_parse2_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: mp_parse2_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mp_parse2_network

  redis:
    image: redis:7-alpine
    container_name: mp_parse2_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - mp_parse2_network

  certbot:
    image: certbot/certbot
    container_name: mp_parse2_certbot
    restart: unless-stopped
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - mp_parse2_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  mp_parse2_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
